name: Build portable Windows application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install bounded release dependencies
        run: python -m pip install -e ".[release]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Build unsigned portable windowed application
        shell: pwsh
        run: |
          $icon = (Resolve-Path "src/morning_app_launcher/resources/morning-app-launcher.ico").Path
          $source = (Resolve-Path "src").Path
          $entry = (Resolve-Path "packaging/windows_entry.py").Path
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name MorningAppLauncher `
            --icon $icon `
            --collect-data morning_app_launcher `
            --paths $source `
            --distpath release-output `
            --workpath build/pyinstaller `
            --specpath build/pyinstaller `
            $entry
      - name: Package portable directory
        shell: pwsh
        run: |
          $directory = "release-output\MorningAppLauncher"
          $archive = "release-output\MorningAppLauncher-portable-windows.zip"
          if (-not (Test-Path -LiteralPath "$directory\MorningAppLauncher.exe" -PathType Leaf)) {
            throw "Portable executable was not produced."
          }
          Compress-Archive -LiteralPath $directory -DestinationPath $archive
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $archive = "release-output\MorningAppLauncher-portable-windows.zip"
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$hash  MorningAppLauncher-portable-windows.zip" -Encoding ascii -NoNewline
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: MorningAppLauncher-portable-windows
          path: |
            release-output/MorningAppLauncher-portable-windows.zip
            release-output/MorningAppLauncher-portable-windows.zip.sha256
          if-no-files-found: error
